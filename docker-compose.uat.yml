name: resolveai-uat

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: resolveai_uat
      POSTGRES_USER: resolveai_uat
      POSTGRES_PASSWORD: resolveai-uat-only
    volumes:
      - uat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai_uat -d resolveai_uat"]
      interval: 3s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://resolveai_uat:resolveai-uat-only@db:5432/resolveai_uat
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_PROVIDER: mock
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-uat-secret-change-locally}
      APP_ENV: uat
      DEBUG: "false"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL:-demo@example.com}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-demo123456}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123456}
    ports:
      - "8000:8000"
    volumes:
      - ./scripts:/opt/resolveai-scripts:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.database.seed &&
             python -m app.database.ingest_policies &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  customer-web:
    build:
      context: ./frontend/customer-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./frontend/admin-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uat_pgdata:
